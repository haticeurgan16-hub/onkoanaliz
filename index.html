<html lang="tr">
<head>

  <style>

      font-family: Arial, sans-serif;
      background: #f5f7fa;
      margin: 0;

    }
    .container {
      max-width: 700px;

    }
    button {
      background: #5b2c83;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>

<body>

  <div class="container">
    <h1>OnkoAnaliz</h1>
    <p>
      OnkoAnaliz, kanserde erken teşhis farkındalığını artırmayı amaçlayan
      web tabanlı bir bilgilendirme ve değerlendirme platformudur.
    </p>
    <p>
      Bu platform tıbbi teşhis amacı taşımaz, yalnızca farkındalık sağlamayı hedefler.
    </p>
    <button>Analize Başla</button>

</html>
